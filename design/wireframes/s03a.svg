<line x1="52" y1="314" x2="132" y2="314" stroke="#1F2430" stroke-width="2"/>
<text x="150" y="274" font-size="14" font-weight="600" fill="#1F2430" text-anchor="start">One-time download, several gigabytes.</text>
<text x="150" y="298" font-size="14" font-weight="400" fill="#1F2430" text-anchor="start">Chrome keeps it for next time. We suggest Wi-Fi.</text>
<text x="150" y="322" font-size="14" font-weight="400" fill="#1F2430" text-anchor="start">The download starts only when you choose it.</text>
<circle cx="780" cy="260" r="11" fill="#111827"/>
