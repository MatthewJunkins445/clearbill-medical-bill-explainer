<text x="40" y="805" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Your bill is read in Chrome on this computer. Nothing is saved after you close the tab.</text>
<text x="1160" y="805" font-size="12" font-weight="600" fill="#6B7280" text-anchor="end">Not medical, legal or financial advice.</text>
<text x="40" y="150" font-size="26" font-weight="700" fill="#1F2430" text-anchor="start">Download the private on-device model</text>
<text x="40" y="190" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">Gemini Nano is an AI model that runs inside Chrome on this computer.</text>
<text x="40" y="212" font-size="15" font-weight="400" fill="#1F2430" text-anchor="start">ClearBill uses it to find and remove your personal details before anything is sent.</text>
<circle cx="24" cy="145" r="11" fill="#111827"/>
<text x="24" y="149.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
