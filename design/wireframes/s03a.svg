<rect x="240" y="390" width="220" height="40" rx="8" fill="#FFFFFF" stroke="#1F2430" stroke-width="1.2"/>
<text x="350.0" y="415" font-size="14" font-weight="600" fill="#1F2430" text-anchor="middle">Use simple rules instead</text>
<text x="240" y="452" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Simple rules find numbers like phone and account numbers,</text>
<text x="240" y="468" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">but not names or diagnoses. You'll need to mark those yourself.</text>
